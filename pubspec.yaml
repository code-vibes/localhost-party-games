name: localhost_party_games
description: Cross-platform party games with same-phone play and Local Host (LAN/hotspot) multiplayer.
publish_to: 'none'
version: 0.2.1+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  web_socket_channel: ^2.4.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^1.0.4
  network_info_plus: ^5.0.3
  uuid: ^4.4.2
  mobile_scanner: ^5.2.3
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
