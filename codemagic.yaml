# Optional Codemagic path for signed iOS (TestFlight) without owning a Mac.
# Connect this repo in Codemagic, add Apple Developer credentials, then start the workflow.
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
